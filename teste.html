<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Image Lightbox</title>
    <style>
        :root {
            --overlay: rgba(0, 0, 0, .85);
            --radius: 14px;
        }

        /* Demo gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .gallery img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            cursor: zoom-in;
            transition: transform .15s ease;
        }

        .gallery img:active {
            transform: scale(.98);
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            display: none;
            place-items: center;
            background: var(--overlay);
            z-index: 9999;
        }

        .lightbox[aria-hidden="false"] {
            display: grid;
        }

        .lightbox__panel {
            position: relative;
            max-width: min(92vw, 1200px);
            max-height: 88vh;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
            background: #000;
            animation: pop .16s ease-out;
        }

        @keyframes pop {
            from {
                transform: scale(.96);
                opacity: .7;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .lightbox__img {
            display: block;
            max-width: 100%;
            max-height: 88vh;
            width: auto;
            height: auto;
            object-fit: contain;
            background: #000;
        }

        .lightbox__caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            color: #fff;
            font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(to top, rgba(0, 0, 0, .6), rgba(0, 0, 0, 0));
            padding: 16px 56px 12px 16px;
            user-select: none;
        }

        .lightbox__close {
            position: absolute;
            top: 8px;
            right: 8px;
            border: 0;
            background: rgba(255, 255, 255, .1);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: grid;
            place-items: center;
            font-size: 18px;
        }

        .lightbox__close:hover {
            background: rgba(255, 255, 255, .2);
        }

        .no-scroll {
            overflow: hidden;
        }
    </style>
</head>

<body>

    <!-- Demo thumbnails. Use data-full for the large source. Alt becomes caption. -->
    <div class="gallery">
        <img src="https://picsum.photos/id/1015/400/300" data-full="https://picsum.photos/id/1015/1600/1200"
            alt="Mountain lake" />
        <img src="https://picsum.photos/id/1039/400/300" data-full="https://picsum.photos/id/1039/1600/1200"
            alt="Forest trail" />
        <img src="https://picsum.photos/id/1024/400/300" data-full="https://picsum.photos/id/1024/1600/1200"
            alt="Majestic dog" />
        <img src="https://picsum.photos/id/1056/400/300" data-full="https://picsum.photos/id/1056/1600/1200"
            alt="Sea cliffs" />
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="lightbox__panel">
            <button class="lightbox__close" type="button" aria-label="Close">&times;</button>
            <img class="lightbox__img" id="lightboxImg" alt="" />
            <div class="lightbox__caption" id="lightboxCaption"></div>
        </div>
    </div>

    <script>
        (function () {
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightboxImg');
            const lbCaption = document.getElementById('lightboxCaption');
            const btnClose = lb.querySelector('.lightbox__close');

            // Open on click
            document.addEventListener('click', function (e) {
                const img = e.target.closest('img[data-full]');
                if (!img) return;
                openLightbox(img.dataset.full || img.src, img.alt || '');
            });

            // Close on backdrop click
            lb.addEventListener('click', function (e) {
                if (e.target === lb) closeLightbox();
            });

            btnClose.addEventListener('click', closeLightbox);

            // Close on Esc
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && lb.getAttribute('aria-hidden') === 'false') closeLightbox();
            });

            // Helpers
            function openLightbox(src, caption) {
                lbImg.src = src;
                lbImg.alt = caption;
                lbCaption.textContent = caption;
                lb.setAttribute('aria-hidden', 'false');
                document.body.classList.add('no-scroll');
                // Preload hint
                const link = document.createElement('link');
                link.rel = 'preload';
                link.as = 'image';
                link.href = src;
                document.head.appendChild(link);
            }

            function closeLightbox() {
                lb.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('no-scroll');
                // Clear to free memory on very large images
                lbImg.src = '';
                lbImg.alt = '';
                lbCaption.textContent = '';
            }
        })();
    </script>
</body>

</html>
